<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>五行神社巡礼 — GOKO SHRINE QUEST</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root {
  --bg: #f5f0e8;
  --ink: #1a1410;
  --muted: #6a5a4a;
  --card: #fffdf8;
  --border: #d4c8b0;

  --water: #3a7ab8;   --water-pale: #ddeeff; --water-deep: #1a4a78;
  --fire:  #c84820;   --fire-pale:  #ffeedd; --fire-deep:  #882200;
  --wood:  #4a8a30;   --wood-pale:  #ddf0d0; --wood-deep:  #2a5a18;
  --earth: #b87820;   --earth-pale: #fff0cc; --earth-deep: #7a5010;
  --metal: #8060c0;   --metal-pale: #eeddf8; --metal-deep: #4a3080;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Noto Sans JP', sans-serif;
  font-weight: 300;
  min-height: 100vh;
}

/* ===== HERO ===== */
.hero {
  background: linear-gradient(135deg, #0a1420 0%, #1a2840 50%, #0a1820 100%);
  color: white;
  text-align: center;
  padding: 3rem 1.5rem 2.5rem;
  position: relative;
  overflow: hidden;
}
.hero::before {
  content: '⛩';
  font-size: 18rem;
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  opacity: .04;
  pointer-events: none;
}
.hero-badge {
  display: inline-block;
  font-size: .65rem;
  letter-spacing: .35em;
  color: #c9a84c;
  border: 1px solid #c9a84c;
  padding: .25rem 1rem;
  margin-bottom: 1.2rem;
}
.hero h1 {
  font-family: 'Noto Serif JP', serif;
  font-size: clamp(1.8rem, 6vw, 3.5rem);
  font-weight: 900;
  line-height: 1.15;
  margin-bottom: .5rem;
}
.hero h1 em { color: #c9a84c; font-style: normal; }
.hero-sub {
  font-size: .88rem;
  color: #a0b8c8;
  letter-spacing: .15em;
  margin-bottom: 2rem;
}

/* ===== ATTR TABS ===== */
.attr-tabs {
  display: flex;
  justify-content: center;
  gap: .4rem;
  flex-wrap: wrap;
  margin-bottom: 1.5rem;
}
.attr-tab {
  padding: .45rem 1.1rem;
  border: 1px solid rgba(255,255,255,.2);
  background: rgba(255,255,255,.06);
  color: rgba(255,255,255,.7);
  font-size: .8rem;
  cursor: pointer;
  border-radius: 2px;
  transition: all .2s;
  font-family: 'Noto Sans JP', sans-serif;
}
.attr-tab:hover { background: rgba(255,255,255,.12); color: white; }
.attr-tab.active { color: white; border-color: currentColor; }
.attr-tab[data-attr="water"].active  { background: rgba(58,122,184,.35); border-color: #5a9ad4; color: #9acfff; }
.attr-tab[data-attr="fire"].active   { background: rgba(200,72,32,.35);  border-color: #e87050; color: #ffb090; }
.attr-tab[data-attr="wood"].active   { background: rgba(74,138,48,.35);  border-color: #70b850; color: #a0e080; }
.attr-tab[data-attr="earth"].active  { background: rgba(184,120,32,.35); border-color: #d8a040; color: #ffd080; }
.attr-tab[data-attr="metal"].active  { background: rgba(128,96,192,.35); border-color: #a888e8; color: #d0b8ff; }

/* ===== MAIN LAYOUT ===== */
.main {
  max-width: 1200px;
  margin: 0 auto;
  padding: 2rem 1.2rem;
  display: grid;
  grid-template-columns: 340px 1fr;
  gap: 1.5rem;
  align-items: start;
}

/* ===== LEFT PANEL ===== */
.left-panel { display: flex; flex-direction: column; gap: 1rem; }

/* 五行診断フォーム */
.diagnosis-card {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 1.2rem;
}
.card-title {
  font-family: 'Noto Serif JP', serif;
  font-size: .88rem;
  color: var(--ink);
  letter-spacing: .1em;
  margin-bottom: 1rem;
  padding-bottom: .5rem;
  border-bottom: 1px solid var(--border);
}
.card-title span { color: #c9a84c; margin-right: .4rem; }

.form-row {
  margin-bottom: .8rem;
}
.form-label {
  display: block;
  font-size: .7rem;
  color: var(--muted);
  letter-spacing: .1em;
  margin-bottom: .3rem;
}
.form-input {
  width: 100%;
  padding: .5rem .7rem;
  border: 1px solid var(--border);
  background: white;
  font-family: 'Noto Sans JP', sans-serif;
  font-size: .82rem;
  color: var(--ink);
  outline: none;
  transition: border-color .2s;
}
.form-input:focus { border-color: #c9a84c; }
.form-row-2col { display: grid; grid-template-columns: 1fr 1fr; gap: .5rem; }

.btn-diagnose {
  width: 100%;
  padding: .7rem;
  background: #1a2840;
  color: #c9a84c;
  border: 1px solid #c9a84c;
  font-family: 'Noto Serif JP', serif;
  font-size: .85rem;
  letter-spacing: .2em;
  cursor: pointer;
  transition: all .2s;
}
.btn-diagnose:hover { background: #c9a84c; color: #1a2840; }

/* 診断結果 */
.result-card {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 1.2rem;
  display: none;
}
.result-card.show { display: block; }

.result-name {
  font-family: 'Noto Serif JP', serif;
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: .3rem;
}
.result-sub { font-size: .7rem; color: var(--muted); margin-bottom: 1rem; }

/* 五行バーチャート */
.gogyou-bars { display: flex; flex-direction: column; gap: .4rem; margin-bottom: .8rem; }
.gogyou-row { display: flex; align-items: center; gap: .6rem; }
.gogyou-label { font-size: .72rem; min-width: 40px; color: var(--muted); }
.gogyou-bar-wrap { flex: 1; height: 12px; background: #e8e0d0; border-radius: 2px; overflow: hidden; }
.gogyou-bar { height: 100%; border-radius: 2px; transition: width 1s ease; }
.gogyou-pct { font-size: .65rem; color: var(--muted); min-width: 30px; text-align: right; }

/* 主属性バッジ */
.main-attr-badge {
  display: flex; align-items: center; gap: .8rem;
  padding: .8rem;
  border: 1px solid;
  margin-bottom: .6rem;
}
.main-attr-icon { font-size: 1.8rem; }
.main-attr-info { flex: 1; }
.main-attr-name { font-family: 'Noto Serif JP', serif; font-size: 1rem; font-weight: 700; }
.main-attr-desc { font-size: .68rem; color: var(--muted); line-height: 1.6; margin-top: .15rem; }
.weak-attr { font-size: .7rem; color: var(--muted); }
.weak-attr strong { color: var(--ink); }

/* スタンプコレクション */
.stamp-card {
  background: var(--card);
  border: 1px solid var(--border);
  padding: 1.2rem;
}
.stamp-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: .4rem;
  margin-top: .6rem;
}
.stamp-item {
  aspect-ratio: 1;
  border: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: .9rem;
  cursor: pointer;
  transition: all .2s;
  background: white;
  position: relative;
}
.stamp-item.collected {
  background: #fffdf0;
  border-color: #c9a84c;
}
.stamp-item.collected::after {
  content: '✓';
  position: absolute;
  top: 1px; right: 2px;
  font-size: .55rem;
  color: #c9a84c;
}
.stamp-item:hover { background: #f5f0e0; }
.stamp-name { font-size: .45rem; color: var(--muted); margin-top: .1rem; text-align: center; line-height: 1.2; }
.stamp-count { font-size: .65rem; color: var(--muted); margin-top: .4rem; }

/* ===== RIGHT: MAP AREA ===== */
.map-area { display: flex; flex-direction: column; gap: 1rem; }

/* 属性見出し */
.attr-headline {
  padding: 1rem 1.2rem;
  border-left: 4px solid;
  background: var(--card);
}
.attr-headline-title {
  font-family: 'Noto Serif JP', serif;
  font-size: 1.1rem;
  font-weight: 700;
  margin-bottom: .15rem;
}
.attr-headline-desc { font-size: .75rem; color: var(--muted); line-height: 1.7; }
.attr-headline-kami { font-size: .7rem; margin-top: .4rem; }

/* 日本地図（切り替え式） */
.japan-map-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  padding: .8rem;
  position: relative;
}
.map-head {
  display: flex; align-items: center; justify-content: space-between;
  gap: .6rem; flex-wrap: wrap; margin-bottom: .6rem;
}
.map-title {
  font-family: 'Noto Serif JP', serif;
  font-size: .78rem;
  color: var(--muted);
  letter-spacing: .15em;
}
.map-switch { display: inline-flex; border: 1px solid var(--border); }
.map-switch button, .map-regions button {
  font-family: 'Noto Sans JP', sans-serif; font-size: .72rem;
  background: transparent; border: 0; color: var(--muted);
  padding: .35rem .7rem; cursor: pointer; letter-spacing: .05em;
}
.map-switch button.on { background: var(--ink); color: #f5f0e8; }
.map-regions { display: flex; gap: .3rem; flex-wrap: wrap; margin-top: .5rem; }
.map-regions button { border: 1px solid var(--border); }
.map-regions button:hover { border-color: #c9a84c; color: var(--ink); }
#leafletMap {
  height: 460px; width: 100%;
  border: 1px solid var(--border);
  font-family: 'Noto Sans JP', sans-serif;
}
#leafletMap.wa {
  background:
    radial-gradient(circle at 20% 30%, rgba(255,255,255,.35), transparent 60%),
    repeating-radial-gradient(circle at 0 100%, transparent 0 14px, rgba(60,80,90,.05) 14px 15px),
    #d9e1df;
}
#leafletMap.real { background: #e8e8e8; }
.map-note { font-size: .65rem; color: var(--muted); margin-top: .4rem; }
.map-fallback { padding: 2rem 1rem; text-align: center; font-size: .8rem; color: var(--muted); }

.shrine-pin {
  width: 28px; height: 28px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-family: 'Noto Serif JP', serif; font-weight: 900; font-size: 13px;
  border: 2px solid #fffdf8;
  box-shadow: 0 1px 4px rgba(0,0,0,.35);
  transition: transform .15s;
}
.shrine-pin:hover { transform: scale(1.18); }
.shrine-pin.done { box-shadow: 0 0 0 3px #c9a84c, 0 1px 4px rgba(0,0,0,.35); }

.leaflet-popup-content-wrapper { border-radius: 2px; }
.leaflet-popup-content { margin: .8rem .9rem; font-family: 'Noto Sans JP', sans-serif; }
.pp-tag { display: inline-block; font-size: .65rem; border: 1px solid; padding: .05rem .4rem; margin-bottom: .3rem; }
.pp-name { font-family: 'Noto Serif JP', serif; font-size: 1rem; font-weight: 700; color: var(--ink); }
.pp-read { font-size: .65rem; color: var(--muted); }
.pp-loc { font-size: .72rem; margin-top: .3rem; color: var(--ink); }
.pp-approx { font-size: .62rem; color: #a06030; margin-top: .2rem; }
.pp-btns { display: flex; gap: .4rem; margin-top: .55rem; }
.pp-btns a, .pp-btns button {
  font-size: .7rem; padding: .3rem .55rem; border: 1px solid var(--border);
  background: var(--card); color: var(--ink); text-decoration: none; cursor: pointer;
  font-family: 'Noto Sans JP', sans-serif;
}
@media (max-width: 700px) { #leafletMap { height: 380px; } }

/* 神社カードグリッド */
.shrine-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: .7rem;
}
.shrine-card {
  background: var(--card);
  border: 1px solid var(--border);
  padding: .9rem;
  transition: border-color .2s, box-shadow .2s;
  cursor: pointer;
  position: relative;
}
.shrine-card:hover {
  box-shadow: 0 2px 12px rgba(0,0,0,.1);
}
.shrine-card.collected { border-color: #c9a84c; }
.shrine-card.collected::before {
  content: '⛩スタンプ取得済み';
  position: absolute;
  top: .4rem; right: .4rem;
  font-size: .55rem;
  color: #c9a84c;
  background: #fffdf0;
  padding: .1rem .4rem;
  border: 1px solid #c9a84c;
}
.shrine-attr-tag {
  font-size: .58rem;
  letter-spacing: .1em;
  padding: .1rem .4rem;
  border: 1px solid;
  border-radius: 1px;
  display: inline-block;
  margin-bottom: .4rem;
}
.shrine-name {
  font-family: 'Noto Serif JP', serif;
  font-size: .9rem;
  font-weight: 700;
  margin-bottom: .1rem;
}
.shrine-read { font-size: .62rem; color: var(--muted); margin-bottom: .3rem; }
.shrine-loc { font-size: .65rem; color: var(--muted); margin-bottom: .4rem; }
.shrine-desc { font-size: .68rem; color: #5a5040; line-height: 1.7; margin-bottom: .5rem; }
.shrine-kami { font-size: .65rem; color: var(--muted); margin-bottom: .5rem; }
.shrine-kami strong { color: var(--ink); }
.shrine-btn-row { display: flex; gap: .4rem; }
.shrine-btn {
  flex: 1;
  padding: .3rem;
  font-size: .65rem;
  border: 1px solid var(--border);
  background: white;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
  color: var(--ink);
  transition: background .2s;
  display: flex; align-items: center; justify-content: center; gap: .2rem;
}
.shrine-btn:hover { background: var(--bg); }
.shrine-btn.stamp-btn { border-color: #c9a84c; color: #8a6820; }
.shrine-btn.stamp-btn:hover { background: #fffdf0; }
.shrine-btn.stamp-btn.done { background: #c9a84c; color: white; border-color: #c9a84c; }

/* TOAST */
.toast {
  position: fixed;
  bottom: 2rem; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: #1a2840;
  color: #c9a84c;
  padding: .7rem 1.5rem;
  font-family: 'Noto Serif JP', serif;
  font-size: .82rem;
  letter-spacing: .1em;
  border: 1px solid #c9a84c;
  transition: transform .3s;
  z-index: 999;
  white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); }

@media(max-width: 800px) {
  .main { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">
  <div class="hero-badge">GOKO SHRINE QUEST</div>
  <h1>五行<em>神社</em>巡礼</h1>
  <p class="hero-sub">生年月日から五行属性を診断 — あなたの神社へ</p>
  <div class="attr-tabs">
    <button class="attr-tab active" data-attr="all">🗾 全て</button>
    <button class="attr-tab" data-attr="water">💧 水</button>
    <button class="attr-tab" data-attr="fire">🔥 火</button>
    <button class="attr-tab" data-attr="wood">🌱 木</button>
    <button class="attr-tab" data-attr="earth">🪨 土</button>
    <button class="attr-tab" data-attr="metal">⚔️ 金</button>
  </div>
</div>

<div class="main">

  <!-- LEFT -->
  <div class="left-panel">

    <!-- 診断フォーム -->
    <div class="diagnosis-card">
      <div class="card-title"><span>✦</span>五行属性 診断</div>
      <div class="form-row">
        <label class="form-label">生年月日</label>
        <input class="form-input" type="date" id="birthdate" value="1990-01-01">
      </div>
      <div class="form-row-2col">
        <div>
          <label class="form-label">出生時刻（任意・四柱推命用）</label>
          <input class="form-input" type="time" id="birthtime" value="12:00">
        </div>
        <div>
          <label class="form-label">性別</label>
          <select class="form-input" id="gender">
            <option value="male">男性</option>
            <option value="female">女性</option>
          </select>
        </div>
      </div>
      <button class="btn-diagnose" onclick="diagnose()">✦ 五行を診断する</button>
    </div>

    <!-- 診断結果 -->
    <div class="result-card" id="resultCard">
      <div class="card-title"><span>✦</span>あなたの五行バランス</div>
      <div id="mainAttrBadge" class="main-attr-badge"></div>
      <div class="gogyou-bars" id="gogyouBars"></div>
      <div class="weak-attr" id="weakAttr"></div>
    </div>

    <!-- スタンプコレクション -->
    <div class="stamp-card">
      <div class="card-title"><span>⛩</span>スタンプコレクション</div>
      <div class="stamp-grid" id="stampGrid"></div>
      <div class="stamp-count" id="stampCount">0 / 25 社参拝済み</div>
    </div>

  </div>

  <!-- RIGHT -->
  <div class="map-area">

    <!-- 属性ヘッドライン -->
    <div class="attr-headline" id="attrHeadline" style="border-color:#c9a84c;">
      <div class="attr-headline-title">🗾 全国の五行神社</div>
      <div class="attr-headline-desc">五行（水・火・木・土・金）の属性別に神社を探せます。属性タブで切り替えてください。</div>
      <div class="attr-headline-kami">✦ 生年月日を入力すると、あなたに合った神社が分かります</div>
    </div>

    <!-- 日本地図（切り替え式） -->
    <div class="japan-map-wrap">
      <div class="map-head">
        <div class="map-title">⛩ 属性別 全国神社マップ</div>
        <div class="map-switch" role="group" aria-label="地図の種類">
          <button type="button" class="on" data-mode="wa">和地図</button>
          <button type="button" data-mode="real">実際の地図</button>
        </div>
      </div>
      <div id="leafletMap" class="wa"></div>
      <div class="map-regions">
        <button type="button" data-region="all">全国</button>
        <button type="button" data-region="tohoku">北海道・東北</button>
        <button type="button" data-region="kanto">関東・中部</button>
        <button type="button" data-region="kansai">関西</button>
        <button type="button" data-region="chugoku">中国・四国</button>
        <button type="button" data-region="kyushu">九州</button>
        <button type="button" data-region="minami">南九州</button>
      </div>
      <div class="map-note">ピンをタップすると神社の詳細とGoogleマップへのリンクが開きます。</div>
    </div>

    <!-- 神社カードグリッド -->
    <div class="shrine-grid" id="shrineGrid"></div>

  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
// ===== 属性定義 =====
const ATTRS = {
  water: { name:'水', icon:'💧', color:'#3a7ab8', pale:'#ddeeff', deep:'#1a4a78',
    title:'💧 水属性の神社',
    desc:'水・海・川・雨・浄化を司る神様。心を整え、芸術性を高め、流れを生み出す力。恋愛・芸術・浄化・直感に関するご利益。',
    kami:'龍神・弁財天・綿津見神・罔象女神（みずはのめのかみ）',
    power:'心を整える・浄化・芸術性・恋愛・直感' },
  fire:  { name:'火', icon:'🔥', color:'#c84820', pale:'#ffeedd', deep:'#882200',
    title:'🔥 火属性の神社',
    desc:'太陽・情熱・勝負・変革を司る神様。情熱と行動力を高め、勝運と事業を後押しする力。仕事運・勝運・事業拡大に。',
    kami:'天照大御神・迦具土神（かぐつちのかみ）・火之迦具土神',
    power:'仕事運・勝負運・事業拡大・変革・情熱' },
  wood:  { name:'木', icon:'🌱', color:'#4a8a30', pale:'#ddf0d0', deep:'#2a5a18',
    title:'🌱 木属性の神社',
    desc:'成長・生命・自然・森を司る神様。心身の健康と子育て、学業成就の力。成長したい・学びたい・健康でいたい方に。',
    kami:'木花咲耶姫命（このはなさくやひめ）・少彦名命・大山祇神',
    power:'健康・子育て・学業・成長・農業' },
  earth: { name:'土', icon:'🪨', color:'#b87820', pale:'#fff0cc', deep:'#7a5010',
    title:'🪨 土属性の神社',

let leafMap = null, pinLayer = null, waLayer = null, realLayer = null, lastFitAttr = null;

function initMap() {
  const el = document.getElementById('leafletMap');
  if (typeof L === 'undefined') {
    el.innerHTML = '<div class="map-fallback">地図を読み込めませんでした。通信環境を確認して再読み込みしてください。</div>';
    return;
  }
  leafMap = L.map(el, { zoomControl: true, minZoom: 4, maxZoom: 17, attributionControl: true, zoomSnap: 0.25 });
  leafMap.attributionControl.setPrefix(false);

  // 和地図：日本の輪郭を和紙と墨で描く
  waLayer = L.geoJSON(JAPAN_GEO, {
    interactive: false,
    style: { color: '#3a2e24', weight: 1.1, fillColor: '#f7f1e3', fillOpacity: 1 },
  });
  // 実際の地図：国土地理院タイル（標準地図）
  realLayer = L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/std/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>',
  });

  pinLayer = L.layerGroup().addTo(leafMap);
  setMapMode('wa');
  leafMap.fitBounds(REGIONS.all);
  lastFitAttr = 'all';

  document.querySelectorAll('.map-switch button').forEach(btn => {
    btn.addEventListener('click', () => setMapMode(btn.dataset.mode));
  });
  document.querySelectorAll('.map-regions button').forEach(btn => {
    btn.addEventListener('click', () => leafMap.flyToBounds(REGIONS[btn.dataset.region], { duration: .6 }));
  });
}

function setMapMode(mode) {
  if (!leafMap) return;
  const el = document.getElementById('leafletMap');
  if (mode === 'real') {
    if (leafMap.hasLayer(waLayer)) leafMap.removeLayer(waLayer);
    realLayer.addTo(leafMap);
    leafMap.setMaxZoom(17);
  } else {
    if (leafMap.hasLayer(realLayer)) leafMap.removeLayer(realLayer);
    waLayer.addTo(leafMap);
    waLayer.bringToBack();
    leafMap.setMaxZoom(10);  // 和地図は輪郭が粗くなるので寄りすぎない
  }
  el.classList.toggle('wa', mode === 'wa');
  el.classList.toggle('real', mode === 'real');
  document.querySelectorAll('.map-switch button').forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
}

function popupHTML(s) {
  const a = ATTRS[s.attr];
  const ll = SHRINE_LL[s.id];
  return `
    <div class="pp-tag" style="border-color:${a.color};color:${a.color};">${a.icon} ${a.name}属性</div>
    <div class="pp-name">${s.name}</div>
    <div class="pp-read">${s.read}</div>
    <div class="pp-loc">📍 ${s.pref}</div>
    ${ll && ll[2] ? '<div class="pp-approx">※ ピンの位置は目安です。正確な場所はGoogleマップで確認してください</div>' : ''}
    <div class="pp-btns">
      <a href="${s.map}" target="_blank" rel="noopener">🗺 Googleマップ</a>
      <button type="button" onclick="focusCard('${s.id}')">詳細を見る</button>
    </div>`;
}

function focusCard(id) {
  const card = document.getElementById('card-' + id);
  if (card) card.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

// ===== 地図ピン生成 =====
function renderMapPins() {
  if (!leafMap) return;
  pinLayer.clearLayers();
  const filtered = currentAttr === 'all' ? SHRINES : SHRINES.filter(s => s.attr === currentAttr);
  const order = ['water','fire','wood','earth','metal'];
  const seen = {};
  const pts = [];
  filtered.forEach(s => {
    const ll = SHRINE_LL[s.id];
    if (!ll) return;
    // 同じ場所に複数属性の神社がある場合は少しずらして重ならないようにする
    const key = ll[0].toFixed(3) + ',' + ll[1].toFixed(3);
    const n = seen[key] = (seen[key] || 0) + 1;
    const off = (n - 1) * 0.004;
    const pos = [ll[0] + off, ll[1] + off];
    const a = ATTRS[s.attr];
    const done = collected.includes(s.id);
    const icon = L.divIcon({
      className: '',
      html: `<div class="shrine-pin${done ? ' done' : ''}" style="background:${a.color}">${ELEMENT_KANJI[s.attr]}</div>`,
      iconSize: [28, 28], iconAnchor: [14, 14], popupAnchor: [0, -14],
    });
    L.marker(pos, { icon, title: s.name, zIndexOffset: order.indexOf(s.attr) })
      .bindPopup(popupHTML(s), { maxWidth: 240 })
      .addTo(pinLayer);
    pts.push(pos);
  });
  // 属性を切り替えたときだけ、その属性の神社が全部入るように表示範囲を合わせる
  if (lastFitAttr !== currentAttr && pts.length) {
    leafMap.flyToBounds(L.latLngBounds(pts).pad(0.15), { duration: .6, maxZoom: 8 });
    lastFitAttr = currentAttr;
  }
}

// ===== 神社カード生成 =====
function renderShrines() {
  const grid = document.getElementById('shrineGrid');
  grid.innerHTML = '';
  const filtered = currentAttr === 'all' ? SHRINES : SHRINES.filter(s => s.attr === currentAttr);
  filtered.forEach(s => {
    const a = ATTRS[s.attr];
    const isCol = collected.includes(s.id);
    const div = document.createElement('div');
    div.className = 'shrine-card' + (isCol ? ' collected' : '');
    div.id = 'card-' + s.id;
    div.innerHTML = `
      <div class="shrine-attr-tag" style="border-color:${a.color};color:${a.color};">${a.icon} ${a.name}属性</div>
      <div class="shrine-name">${s.name}</div>
      <div class="shrine-read">${s.read}</div>
      <div class="shrine-loc">📍 ${s.pref}</div>
      <div class="shrine-desc">${s.desc}</div>
      <div class="shrine-kami">🙏 <strong>祭神：</strong>${s.kami}</div>
      <div class="shrine-btn-row">
        <a class="shrine-btn" href="${s.map}" target="_blank" rel="noopener">🗺 地図</a>
        <button class="shrine-btn stamp-btn ${isCol?'done':''}" onclick="toggleStamp('${s.id}',this)">
          ${isCol ? '✓ 参拝済み' : '⛩ 参拝記録'}
        </button>
      </div>
    `;
    grid.appendChild(div);
  });
}

// ===== スタンプ =====
function toggleStamp(id, btn) {
  const idx = collected.indexOf(id);
  if(idx === -1) {
    collected.push(id);
    btn.textContent = '✓ 参拝済み';
    btn.classList.add('done');
    const card = document.getElementById('card-' + id);
    if(card) card.classList.add('collected');
    const shrine = SHRINES.find(s => s.id === id);
    showToast('⛩ ' + shrine.name + ' — 参拝スタンプ取得！');
  } else {
    collected.splice(idx, 1);
    btn.textContent = '⛩ 参拝記録';
    btn.classList.remove('done');
    const card = document.getElementById('card-' + id);
    if(card) card.classList.remove('collected');
  }
  localStorage.setItem('gokoStamps', JSON.stringify(collected));
  renderStampGrid();
  renderMapPins();
}

// ===== スタンプグリッド =====
function renderStampGrid() {
  const grid = document.getElementById('stampGrid');
  grid.innerHTML = '';
  SHRINES.forEach(s => {
    const a = ATTRS[s.attr];
    const isCol = collected.includes(s.id);
    const div = document.createElement('div');
    div.className = 'stamp-item' + (isCol ? ' collected' : '');
    div.title = s.name;
    div.style.borderColor = isCol ? a.color : '';
    div.innerHTML = `
      <span>${isCol ? a.icon : '⬜'}</span>
      <span class="stamp-name">${s.name.slice(0,4)}</span>
    `;
    div.addEventListener('click', () => {
      const card = document.getElementById('card-' + s.id);
      if(card) {
        currentAttr = s.attr;
        updateAttrUI();
        setTimeout(() => card.scrollIntoView({ behavior:'smooth', block:'center' }), 100);
      }
    });
    grid.appendChild(div);
  });
  document.getElementById('stampCount').textContent = `${collected.length} / ${SHRINES.length} 社参拝済み`;
}

// ===== 属性UI更新 =====
function updateAttrUI() {
  document.querySelectorAll('.attr-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.attr === currentAttr);
  });
  const h = document.getElementById('attrHeadline');
  if(currentAttr === 'all') {
    h.style.borderColor = '#c9a84c';
    h.querySelector('.attr-headline-title').textContent = '🗾 全国の五行神社';
    h.querySelector('.attr-headline-desc').textContent = '五行（水・火・木・土・金）の属性別に神社を探せます。';
    h.querySelector('.attr-headline-kami').textContent = '✦ 生年月日を入力すると、あなたに合った神社が分かります';
  } else {
    const a = ATTRS[currentAttr];
    h.style.borderColor = a.color;
    h.querySelector('.attr-headline-title').textContent = a.title;
    h.querySelector('.attr-headline-desc').textContent = a.desc;
    h.querySelector('.attr-headline-kami').innerHTML = `✦ 主な神様：${a.kami}<br>✦ ご利益：${a.power}`;
  }
  renderMapPins();
  renderShrines();
}

// ===== タブクリック =====
document.querySelectorAll('.attr-tab').forEach(t => {
  t.addEventListener('click', () => {
    currentAttr = t.dataset.attr;

  });

// ===== 四柱推命 正確計算 =====

// 天干・地支
const STEMS   = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const BRANCHES= ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const STEM_ATTR  = ['wood','wood','fire','fire','earth','earth','metal','metal','water','water'];
const BRANCH_ATTR= ['water','earth','wood','wood','earth','fire','fire','earth','metal','metal','earth','water'];

// 日干支計算（基準: 1900/1/1 = 甲戌 = 干支番号10 ※甲子=0）
// UTCで日数差を取り、端末のタイムゾーン・夏時間の影響を受けないようにする
function getDayStemBranch(year, month, day) {
  const d    = Date.UTC(year, month-1, day);
  const base = Date.UTC(1900, 0, 1);
  const diff = Math.round((d - base) / 86400000);
  let idx = (diff + 10) % 60;
  if(idx < 0) idx += 60;
  return { stemIdx: idx % 10, branchIdx: idx % 12 };
}

// 年干支計算（基準: 1900年 = 庚子 = 干支番号36）
function getYearStemBranch(year) {
  let idx = (year - 1900 + 36) % 60;
  if(idx < 0) idx += 60;
  return { stemIdx: idx % 10, branchIdx: idx % 12 };
}

// 節入り月計算（二十四節気の概算）
// 各月の節入り日（概算・グレゴリオ暦）
const SEKKI_DAYS = [6,4,6,5,6,6,7,7,8,8,7,7]; // 1月〜12月の節入り概算日
function getMonthStemBranch(year, month, day) {
  // 節入り前は前月扱い
  let adjMonth = month;
  const sekkiDay = SEKKI_DAYS[month-1];
  if(day < sekkiDay) adjMonth = month - 1;
  if(adjMonth <= 0) adjMonth += 12;
  
  // 月の天干計算（年干から導出）
  const yearStem = getYearStemBranch(year).stemIdx;
  // 年干グループ: 甲己年→月天干は甲から、乙庚→丙から、丙辛→戊から、丁壬→庚から、戊癸→壬から
  const monthStemBase = [0, 2, 4, 6, 8, 0, 2, 4, 6, 8][yearStem]; // 甲=0,乙=2,丙=4,丁=6,戊=8,己=0...
  const monthStemIdx  = (monthStemBase + (adjMonth - 1)) % 10;
  // 月支は固定（寅=2月始まり）
  const monthBranchIdx = (adjMonth + 1) % 12; // 寅(2)が1月節
  
  return { stemIdx: monthStemIdx, branchIdx: (adjMonth + 1) % 12 };
}

// 時支計算
function getHourStemBranch(year, month, day, hour) {
  const daySB = getDayStemBranch(year, month, day);
  // 時支: 子(23-1)=0, 丑(1-3)=1, ...
  const hourBranchIdx = Math.floor(((hour + 1) % 24) / 2);
  // 時天干: 日干グループから
  const hourStemBase = [0,2,4,6,8,0,2,4,6,8][daySB.stemIdx];
  const hourStemIdx  = (hourStemBase + hourBranchIdx) % 10;
  return { stemIdx: hourStemIdx, branchIdx: hourBranchIdx };
}

// 九星気学 本命星（参考表示用）
function calcKyusei(year, month, day) {
  let y = year;
  if(month < 2 || (month === 2 && day < 4)) y = year - 1;
  let s = y;
  while(s >= 10) s = String(s).split('').reduce((a,b)=>a+parseInt(b),0);
  let star = 11 - s;
  if(star > 9) star -= 9;
  if(star <= 0) star += 9;
  return star;
}

const KYUSEI_NAMES = ['','一白水星','二黒土星','三碧木星','四緑木星','五黄土星','六白金星','七赤金星','八白土星','九紫火星'];
const KYUSEI_ATTR  = ['','water','earth','wood','wood','earth','metal','metal','earth','fire'];

// ===== 五行診断メイン =====
function diagnose() {
  const dateStr = document.getElementById('birthdate').value;
  const timeStr = document.getElementById('birthtime').value;
  if(!dateStr){ showToast('⚠ 生年月日を入力してください'); return; }

  const d     = new Date(dateStr);
  const year  = d.getFullYear();
  const month = d.getMonth() + 1;
  const day   = d.getDate();
  const hour  = parseInt((timeStr||'12:00').split(':')[0]);

  // 四柱（年・月・日・時）の天干地支を取得
  const yearSB  = getYearStemBranch(year);
  const monthSB = getMonthStemBranch(year, month, day);
  const daySB   = getDayStemBranch(year, month, day);
  const hourSB  = getHourStemBranch(year, month, day, hour);

  // 日干（最重要・その人そのもの）
  const nichikan     = STEMS[daySB.stemIdx];
  const nichikanAttr = STEM_ATTR[daySB.stemIdx];

  // 五行スコア（四柱8字から計算）
  const scores = { water:0, fire:0, wood:0, earth:0, metal:0 };
  // 天干4つ（各+15）
  [yearSB.stemIdx, monthSB.stemIdx, daySB.stemIdx, hourSB.stemIdx].forEach((si,i) => {
    const w = i===2 ? 25 : 15; // 日干を最重視
    scores[STEM_ATTR[si]] += w;
  });
  // 地支4つ（各+10）
  [yearSB.branchIdx, monthSB.branchIdx, daySB.branchIdx, hourSB.branchIdx].forEach((bi,i) => {
    scores[BRANCH_ATTR[bi]] += 10;
  });

  // 九星気学（参考）
  const kyuseiNum  = calcKyusei(year, month, day);
  const kyuseiName = KYUSEI_NAMES[kyuseiNum];
  const kyuseiAttr = KYUSEI_ATTR[kyuseiNum];
  scores[kyuseiAttr] += 5; // 九星も少し加味

  // 主属性＝日干の五行（四柱推命の本義）
  const mainAttr = nichikanAttr;
  const sorted   = Object.entries(scores).sort((a,b)=>b[1]-a[1]);
  const weakAttr = sorted[4][0];
  const total    = Object.values(scores).reduce((a,b)=>a+b,0);

  // ===== 結果表示 =====
  const rc = document.getElementById('resultCard');
  rc.classList.add('show');

  const mainA = ATTRS[mainAttr];
  const weakA = ATTRS[weakAttr];

  // 日干の性格説明
  const nichikanDesc = {
    '甲':{ desc:'大樹のような堂々とした存在感。リーダー気質・正義感・向上心が強い。',  attr:'wood'  },
    '乙':{ desc:'草花のようにしなやかで適応力が高い。人間関係を大切にし協調性がある。',attr:'wood'  },
    '丙':{ desc:'太陽のように明るく情熱的。人を引き付けるカリスマと行動力の持ち主。',  attr:'fire'  },
    '丁':{ desc:'ろうそくの炎のように温かく繊細。直感力と美意識が高く芸術的センスがある。',attr:'fire'},
    '戊':{ desc:'大山のような安定感と包容力。堅実で信頼され、組織の要となる存在。',    attr:'earth' },
    '己':{ desc:'大地のように豊かで柔軟。人の話をよく聞き、縁の下の力持ちになれる。',  attr:'earth' },
    '庚':{ desc:'鉄のような意志の強さと決断力。原則を重んじ、信念を貫くリーダー。',    attr:'metal' },
    '辛':{ desc:'宝石のように研ぎ澄まされた感性。完璧主義で美意識が高く細部に気を配る。',attr:'metal'},
    '壬':{ desc:'大海のような広大な視野と受容力。自由を愛し、流れに乗るのが得意。',    attr:'water' },
    '癸':{ desc:'雨のように静かに深く染み込む知性。直感力と洞察力に優れる内向きの力。',attr:'water' },
  };
  const nd = nichikanDesc[nichikan] || { desc:'', attr: nichikanAttr };

  document.getElementById('mainAttrBadge').innerHTML = `
    <div class="main-attr-icon">${mainA.icon}</div>
    <div class="main-attr-info">
      <div class="main-attr-name" style="color:${mainA.color};">日干「${nichikan}」— ${mainA.name}属性</div>
      <div class="main-attr-desc">${nd.desc}</div>
    </div>
  `;
  document.getElementById('mainAttrBadge').style.borderColor = mainA.color;
  document.getElementById('mainAttrBadge').style.background  = mainA.pale;

  // 五行バー
  const bars = document.getElementById('gogyouBars');
  bars.innerHTML = '';
  sorted.forEach(([attr,val]) => {
    const a   = ATTRS[attr];
    const pct = Math.round(val/total*100);
    bars.innerHTML += `
      <div class="gogyou-row">
        <div class="gogyou-label">${a.icon}${a.name}</div>
        <div class="gogyou-bar-wrap">
          <div class="gogyou-bar" style="width:${pct}%;background:${a.color};"></div>
        </div>
        <div class="gogyou-pct">${pct}%</div>
      </div>
    `;
  });

  // 四柱の詳細表示
  document.getElementById('weakAttr').innerHTML = `
    <strong>✦ 補うべき属性：</strong>${weakA.icon}${weakA.name}属性が弱め。
    <span style="color:${weakA.color};cursor:pointer;text-decoration:underline;" onclick="filterAttr('${weakAttr}')">
      → ${weakA.name}属性の神社を見る
    </span>
    <div style="margin-top:.6rem;padding:.6rem;background:#f5f0e0;border-left:3px solid #c9a84c;font-size:.66rem;color:#6a5a3a;line-height:2;">
      <strong>📋 四柱（命式）</strong><br>
      年柱：${STEMS[yearSB.stemIdx]}${BRANCHES[yearSB.branchIdx]}
      （${ATTRS[STEM_ATTR[yearSB.stemIdx]].icon}${ATTRS[STEM_ATTR[yearSB.stemIdx]].name}）<br>
      月柱：${STEMS[monthSB.stemIdx]}${BRANCHES[monthSB.branchIdx]}
      （${ATTRS[STEM_ATTR[monthSB.stemIdx]].icon}${ATTRS[STEM_ATTR[monthSB.stemIdx]].name}）<br>
      <strong>日柱：${STEMS[daySB.stemIdx]}${BRANCHES[daySB.branchIdx]}
      （日干「${nichikan}」＝あなたの本質 ${mainA.icon}${mainA.name}）</strong><br>
      時柱：${STEMS[hourSB.stemIdx]}${BRANCHES[hourSB.branchIdx]}
      （${ATTRS[STEM_ATTR[hourSB.stemIdx]].icon}${ATTRS[STEM_ATTR[hourSB.stemIdx]].name}）<br>
      ─────────────────<br>
      九星気学（参考）：${kyuseiName}
    </div>
  `;

  // 自動で弱属性神社を表示
  setTimeout(() => {
    filterAttr(weakAttr);
    showToast('✦ 日干「' + nichikan + '」' + mainA.icon + mainA.name + '属性！弱い' + weakA.icon + weakA.name + 'の神社を表示中');
  }, 600);
}


// ===== TOAST =====
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}

// ===== 初期化 =====
initMap();
renderMapPins();
renderShrines();
renderStampGrid();
</script>
